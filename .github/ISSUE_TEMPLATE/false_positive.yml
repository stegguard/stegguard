name: Detection quality report
description: Report a false positive or false negative
title: "[Detection]: "
labels: [detection-quality]
body:
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options:
        - False positive
        - False negative
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: StegGuard version and platform
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Expected label and observed evidence
      description: Include category, format, command, exit code, and redacted report fields.
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Safe reproducer
      description: Prefer escaped or generated data. Do not attach private or weaponized files.
    validations:
      required: true
  - type: input
    id: origin
    attributes:
      label: Sample origin and license
      description: Required before a case can join the public corpus.

