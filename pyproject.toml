[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stegguard"
dynamic = ["version"]
description = "Detect, decode, and safely remove hidden content and provenance signals"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Aditya Arakeri"}]
maintainers = [{name = "Aditya Arakeri"}]
requires-python = ">=3.12,<3.15"
keywords = ["steganography", "detection", "security", "llm", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# No mandatory runtime dependencies — stdlib only
dependencies = []

[project.urls]
Source = "https://github.com/stegguard/stegguard"
Documentation = "https://github.com/stegguard/stegguard/tree/main/docs"
Changelog = "https://github.com/stegguard/stegguard/blob/main/CHANGELOG.md"
Issues = "https://github.com/stegguard/stegguard/issues"
Security = "https://github.com/stegguard/stegguard/security/policy"

[project.optional-dependencies]
images = [
    "Pillow>=12.0.0",
]
dev = [
    "bandit>=1.8",
    "build>=1.2",
    "check-wheel-contents>=0.6",
    "hypothesis>=6.0",
    "mypy>=1.15",
    "pip-audit>=2.9",
    "pygments>=2.20.0",
    "pytest>=9.0.3",
    "pytest-cov",
    "ruff>=0.12",
    "twine>=6.0",
]

[project.scripts]
stegguard = "stegguard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stegguard*"]

[tool.setuptools.dynamic]
version = {attr = "stegguard._version.__version__"}

[tool.setuptools.package-data]
stegguard = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["stegguard"]

[tool.coverage.report]
fail_under = 82
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
